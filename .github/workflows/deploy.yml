name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export PATH="$PATH:$(npm config get prefix)/bin"
            cd /var/www/opal-outreach-ai
            # `git pull` silently aborted for two deploys in a row here
            # (a package-lock.json merge conflict from a manual npm install
            # on the box) while every later command in this script still
            # ran and "succeeded" — so GitHub Actions reported green while
            # the VPS kept serving code from before those two commits.
            # `set -e` makes any failing command here fail the whole job
            # loudly, and resetting hard to origin/main (instead of pull)
            # means there is no local-changes state left to conflict with
            # in the first place.
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npx prisma generate
            # --accept-data-loss: Prisma's own safety check refuses to add a
            # new @unique column over existing rows without it, even though
            # every existing row just gets NULL there (Postgres allows any
            # number of NULLs under a unique constraint — no rows are
            # actually dropped or altered). This flag makes that specific,
            # safe case non-interactive; a change that would actually drop
            # a column or table with real data still needs its own review
            # before merging, not blind trust in this flag.
            npx prisma db push --skip-generate --accept-data-loss
            npm run build
            pm2 restart opal-outreach --update-env
