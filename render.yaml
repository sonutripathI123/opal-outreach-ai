services:
  - type: web
    name: opal-outreach-ai
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets below are intentionally NOT stored in this file.
      # Set their values in the Render dashboard (Environment tab). sync:false
      # keeps them out of the blueprint/version control.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: AI_MODEL_PRIMARY
        value: claude-3-5-sonnet-20241022
      - key: NEXT_PUBLIC_APP_NAME
        value: Opal Outreach AI
      - key: NEXT_PUBLIC_COMPANY_NAME
        value: Opal Chauffeurs
      - key: NEXT_PUBLIC_WEBSITE
        value: https://www.opalchauffeurs.com.au/
